<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>คุณเหมาะที่จะอยู่ทีมขายหรือทีมบัญชี (EWB Version) </title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai+Looped:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --pink: #E8366F;
            --orange: #F2A138;
            --dark: #1a1625;
            --card-bg: rgba(255,255,255,0.92);
            --border: rgba(0,0,0,0.08);
        }

        body {
            font-family: 'Noto Sans Thai Looped', 'Space Grotesk', sans-serif;
            background-color: #FBF0F5;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Animated dot grid background */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: radial-gradient(circle, #f0b8cc 1px, transparent 1px);
            background-size: 24px 24px;
            opacity: 0.5;
            pointer-events: none;
            z-index: 0;
        }

        /* Floating blobs */
        .blob {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.18;
            pointer-events: none;
            animation: floatBlob 12s ease-in-out infinite alternate;
            z-index: 0;
        }
        .blob-1 { width: 400px; height: 400px; background: #E8366F; top: -100px; left: -100px; animation-delay: 0s; }
        .blob-2 { width: 350px; height: 350px; background: #F2A138; bottom: -80px; right: -80px; animation-delay: 4s; }
        .blob-3 { width: 250px; height: 250px; background: #9B6FD4; top: 40%; left: 60%; animation-delay: 8s; }

        @keyframes floatBlob {
            from { transform: translate(0, 0) scale(1); }
            to { transform: translate(30px, 20px) scale(1.08); }
        }

        /* ── BG Doodle Layer ── */
        .doodle-layer {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }
        .doodle-layer svg {
            width: 100%;
            height: 100%;
        }
        .doodle-item {
            opacity: 0;
            animation: doodleFadeIn 1.4s ease forwards, doodleFloat 9s ease-in-out infinite;
        }
        @keyframes doodleFadeIn {
            from { opacity: 0; transform: scale(0.8) translateY(6px); }
            to   { opacity: 0.22; transform: scale(1) translateY(0); }
        }
        @keyframes doodleFloat {
            0%,100% { transform: translateY(0px); }
            50%      { transform: translateY(-7px); }
        }

        /* ── Doodle BG Layer ── */
        .doodle-layer {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }
        .doodle-layer svg {
            width: 100%;
            height: 100%;
        }
        .doodle-item {
            animation: doodleFloat 8s ease-in-out infinite alternate;
        }
        .doodle-item:nth-child(2n)  { animation-delay: 1.5s; animation-duration: 10s; }
        .doodle-item:nth-child(3n)  { animation-delay: 3s;   animation-duration: 12s; }
        .doodle-item:nth-child(4n)  { animation-delay: 4.5s; animation-duration: 9s;  }
        .doodle-item:nth-child(5n)  { animation-delay: 2s;   animation-duration: 11s; }
        @keyframes doodleFloat {
            from { transform: translateY(0px) rotate(0deg); }
            to   { transform: translateY(-12px) rotate(4deg); }
        }

        /* Lang switch */
        .lang-switch {
            position: fixed;
            top: 18px;
            right: 18px;
            z-index: 100;
            background: white;
            border: 1px solid var(--border);
            border-radius: 100px;
            padding: 6px 14px;
            font-size: 12px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
            cursor: pointer;
        }
        .switch { position: relative; display: inline-block; width: 36px; height: 20px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background: #ddd; transition: .3s; border-radius: 20px; }
        .slider::before { position: absolute; content: ""; height: 14px; width: 14px; left: 3px; bottom: 3px; background: white; transition: .3s; border-radius: 50%; }
        input:checked + .slider { background: var(--dark); }
        input:checked + .slider::before { transform: translateX(16px); }

        /* Main wrapper */
        #app {
            position: relative;
            z-index: 1;
            max-width: 960px;
            margin: 0 auto;
            padding: 60px 20px 40px;
        }

        /* Result layout: card left + boss panel right */
        .result-layout {
            display: flex;
            gap: 20px;
            align-items: flex-start;
        }
        .result-main { flex: 0 0 480px; min-width: 0; }

        /* Boss panel */
        .boss-panel {
            flex: 1;
            min-width: 0;
            animation: slideInRight 0.6s cubic-bezier(0.34,1.2,0.64,1) forwards;
        }
        @keyframes slideInRight {
            from { opacity: 0; transform: translateX(40px); }
            to { opacity: 1; transform: translateX(0); }
        }
        .boss-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 28px;
            border: 1px solid rgba(255,255,255,0.9);
            box-shadow: 0 8px 40px rgba(232,54,111,0.08), 0 2px 8px rgba(0,0,0,0.04);
            overflow: hidden;
            text-align: center;
        }
        .boss-header {
            padding: 20px 20px 0;
        }
        .boss-label {
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #bbb;
            margin-bottom: 14px;
        }
        .boss-img-wrap {
            position: relative;
            display: inline-block;
            margin-bottom: 0;
        }
        .boss-img {
            width: 160px;
            height: auto;
            aspect-ratio: 3/4;
            object-fit: cover;
            object-position: center top;
            border-radius: 20px;
            border: 4px solid white;
            box-shadow: 0 6px 24px rgba(0,0,0,0.15);
            display: block;
            margin: 0 auto;
        }
to { transform: rotate(360deg); }
        }
        .boss-body {
            padding: 16px 20px 24px;
        }
        .boss-name {
            font-size: 20px;
            font-weight: 900;
            color: var(--dark);
            margin-bottom: 4px;
        }
        .boss-role {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 14px;
        }
        .boss-quote {
            background: #fdf5f8;
            border-left: 3px solid;
            border-radius: 0 12px 12px 0;
            padding: 12px 14px;
            font-size: 13px;
            line-height: 1.6;
            color: #666;
            text-align: left;
        }

        /* Responsive: stack on narrow */
        @media (max-width: 700px) {
            .result-layout { flex-direction: column; }
            .result-main { flex: unset; width: 100%; }
        }

        /* Card */
        .card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 28px;
            border: 1px solid rgba(255,255,255,0.9);
            box-shadow: 0 8px 40px rgba(232,54,111,0.08), 0 2px 8px rgba(0,0,0,0.04);
            overflow: hidden;
        }

        /* ── INTRO ── */
        .intro-header {
            background: linear-gradient(135deg, #1a1625 0%, #2d1f3d 100%);
            padding: 40px 36px 32px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        .intro-header::after {
            content: '';
            position: absolute;
            width: 200px; height: 200px;
            background: radial-gradient(circle, rgba(232,54,111,0.3) 0%, transparent 70%);
            top: -60px; right: -60px;
            pointer-events: none;
        }
        .intro-mascots {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-bottom: 20px;
        }
        .mascot-pill {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 100px;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: white;
            font-weight: 700;
            font-size: 14px;
        }
        .mascot-emoji { font-size: 24px; }
        .intro-title {
            color: white;
            font-size: 22px;
            font-weight: 800;
            line-height: 1.3;
            margin-bottom: 8px;
        }
        .intro-sub {
            color: rgba(255,255,255,0.55);
            font-size: 13px;
            line-height: 1.6;
        }
        .intro-body { padding: 28px 28px; }
        .intro-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 24px;
        }
        .stat-pill {
            background: #FBF0F5;
            border-radius: 16px;
            padding: 16px;
            text-align: center;
        }
        .stat-num { font-size: 24px; font-weight: 800; color: var(--dark); }
        .stat-label { font-size: 11px; color: #999; margin-top: 2px; font-weight: 500; }

        /* Start button */
        .btn-start {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, var(--pink), #c0234f);
            color: white;
            border: none;
            border-radius: 18px;
            font-size: 16px;
            font-weight: 800;
            font-family: inherit;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: transform 0.15s, box-shadow 0.15s;
            box-shadow: 0 6px 24px rgba(232,54,111,0.35);
        }
        .btn-start::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.15), transparent);
            pointer-events: none;
        }
        .btn-start:hover { transform: translateY(-2px); box-shadow: 0 10px 32px rgba(232,54,111,0.45); }
        .btn-start:active { transform: scale(0.98); }

        /* ── QUIZ ── */
        .quiz-top {
            padding: 24px 28px 0;
        }
        .progress-track {
            height: 6px;
            background: #f0e0e8;
            border-radius: 6px;
            overflow: hidden;
            margin-bottom: 8px;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--pink), #F2A138);
            border-radius: 6px;
            transition: width 0.4s cubic-bezier(0.34,1.2,0.64,1);
        }
        .progress-label {
            font-size: 11px;
            font-weight: 700;
            color: #bbb;
            text-align: right;
        }
        .quiz-body { padding: 24px 28px 28px; }
        .question-num {
            font-size: 11px;
            font-weight: 800;
            color: var(--pink);
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 12px;
        }
        .question-text {
            font-size: 19px;
            font-weight: 700;
            line-height: 1.5;
            color: var(--dark);
            margin-bottom: 28px;
            min-height: 60px;
        }
        .quiz-btns { display: grid; gap: 12px; }
        .btn-yes, .btn-no {
            width: 100%;
            padding: 16px 20px;
            border-radius: 16px;
            font-size: 15px;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            border: 2px solid #eee;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 12px;
            background: #fff;
            color: #555;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        .btn-yes:hover, .btn-no:hover {
            background: var(--pink);
            color: white;
            border-color: var(--pink);
            box-shadow: 0 6px 20px rgba(232,54,111,0.3);
            transform: translateY(-2px);
        }
        .btn-yes:active, .btn-no:active { transform: scale(0.98); }

        .btn-back {
            background: none;
            border: none;
            color: #bbb;
            font-size: 12px;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            padding: 0 0 16px;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: color 0.15s;
        }
        .btn-back:hover { color: var(--dark); }

        /* ── RESULT ── */
        .result-hero {
            padding: 36px 28px 28px;
            text-align: center;
            position: relative;
        }
        .result-label {
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #bbb;
            margin-bottom: 16px;
        }
        .result-mascot-wrap {
            position: relative;
            display: inline-block;
            margin-bottom: 16px;
        }
        .result-mascot-img {
            width: 100px;
            height: 100px;
            object-fit: contain;
            image-rendering: pixelated;
            position: relative;
            z-index: 1;
            animation: mascotBounce 2s ease-in-out infinite;
            mix-blend-mode: multiply;
            background: transparent;
        }
        @keyframes mascotBounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
        .result-mascot-glow {
            position: absolute;
            width: 120px; height: 120px;
            border-radius: 50%;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            animation: glowPulse 2s ease-in-out infinite;
        }
        @keyframes glowPulse {
            0%, 100% { opacity: 0.3; transform: translate(-50%,-50%) scale(1); }
            50% { opacity: 0.6; transform: translate(-50%,-50%) scale(1.15); }
        }
        .result-team {
            font-size: 30px;
            font-weight: 900;
            margin-bottom: 8px;
        }
        .result-desc {
            font-size: 14px;
            color: #888;
            line-height: 1.6;
            padding: 0 12px;
        }

        /* Divider */
        .section-divider {
            height: 1px;
            background: linear-gradient(90deg, transparent, #f0d8e4, transparent);
            margin: 0 28px;
        }

        /* RIASEC bars */
        .riasec-section { padding: 24px 28px; }
        .riasec-title {
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #bbb;
            margin-bottom: 18px;
        }
        .bar-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
        }
        .bar-label {
            width: 90px;
            font-size: 10px;
            font-weight: 700;
            color: #999;
            flex-shrink: 0;
            line-height: 1.3;
        }
        .bar-track {
            flex: 1;
            height: 10px;
            background: #f4e8ef;
            border-radius: 10px;
            overflow: hidden;
        }
        .bar-fill {
            height: 100%;
            border-radius: 10px;
            width: 0;
            transition: width 1.2s cubic-bezier(0.34,1.2,0.64,1);
        }
        .bar-pct {
            width: 30px;
            font-size: 11px;
            font-weight: 800;
            color: var(--dark);
            text-align: right;
        }

        /* Action buttons */
        .action-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            padding: 0 28px 28px;
        }
        .btn-action {
            padding: 13px;
            border-radius: 14px;
            font-size: 13px;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            border: none;
            transition: all 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .btn-restart {
            background: #f5f0f8;
            color: #7b5fa0;
        }
        .btn-restart:hover { background: #ede5f5; transform: translateY(-1px); }
        .btn-save { background: #1a1625; color: white; }
        .btn-save:hover { background: var(--dark); transform: translateY(-1px); }
        .btn-share { background: #1da1f2; color: white; }
        .btn-share:hover { background: #0d8ecf; transform: translateY(-1px); }

        /* Confetti canvas */
        #confetti-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            pointer-events: none;
            z-index: 999;
        }

        /* Slide-up animation */
        .slide-up {
            animation: slideUp 0.5s cubic-bezier(0.34,1.2,0.64,1) forwards;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(32px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Score ring */
        .score-ring-wrap {
            display: flex;
            justify-content: center;
            gap: 24px;
            padding: 20px 28px;
        }
        .score-ring {
            text-align: center;
        }
        .ring-label {
            font-size: 11px;
            font-weight: 700;
            color: #bbb;
            margin-top: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Staggered bar animation */
        .bar-fill.animated { transition: width 1s cubic-bezier(0.34,1.2,0.64,1); }

        /* Tooltip tag */
        .dna-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: #fff8f0;
            border: 1px solid #fde5c0;
            border-radius: 100px;
            padding: 6px 14px;
            font-size: 12px;
            font-weight: 700;
            color: #c97a1a;
            margin-top: 10px;
        }
        .dna-badge.acc { background: #fff0f5; border-color: #f9c5d9; color: #c0234f; }

        /* ── RESULT GRID LAYOUT ── */
        .result-grid-wrap { width: 100%; }
        .rg-top { display: grid; grid-template-columns: 1fr 1fr; }
        .rg-team {
            padding: 28px 22px; text-align: center;
            border-right: 1px solid rgba(0,0,0,0.06);
            display: flex; flex-direction: column; align-items: center;
        }
        .rg-boss {
            padding: 28px 22px; text-align: center;
            display: flex; flex-direction: column; align-items: center;
        }
        .rg-chip {
            display: inline-block; font-size: 10px; font-weight: 800;
            letter-spacing: 1.5px; text-transform: uppercase;
            border-radius: 100px; padding: 5px 12px; margin-bottom: 12px;
        }
        .rg-mascot-wrap { position: relative; display: inline-block; margin-bottom: 8px; }
        .rg-team-name { font-size: 20px; font-weight: 900; margin-bottom: 8px; }
        .rg-team-desc { font-size: 12px; color: #888; line-height: 1.6; }
        .rg-bottom { border-top: 1px solid rgba(0,0,0,0.06); padding: 22px 28px 20px; }
        .rg-bars { margin-top: 4px; }

        /* RIASEC Summary Box */
        .riasec-summary {
            margin-top: 20px;
            background: #fafafa;
            border: 1px solid rgba(0,0,0,0.06);
            border-radius: 18px;
            padding: 18px 18px 12px;
        }
        .summary-title {
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: #aaa;
            margin-bottom: 14px;
        }
        .summary-items { display: flex; flex-direction: column; gap: 12px; }
        .summary-item {
            background: white;
            border-radius: 12px;
            padding: 12px 14px;
            border: 1px solid rgba(0,0,0,0.05);
        }
        .summary-item-head {
            display: flex;
            align-items: center;
            gap: 7px;
            margin-bottom: 5px;
        }
        .summary-icon { font-size: 13px; }
        .summary-dim { font-size: 12px; font-weight: 800; flex: 1; }
        .summary-level { font-size: 11px; font-weight: 700; }
        .summary-text { font-size: 12px; color: #666; line-height: 1.6; }

        /* Disclaimer */
        .disclaimer {
            display: flex;
            gap: 10px;
            align-items: flex-start;
            margin-top: 18px;
            background: #f8f6ff;
            border: 1px solid #e4dff5;
            border-radius: 14px;
            padding: 14px 16px;
        }
        .disclaimer-icon { font-size: 16px; flex-shrink: 0; margin-top: 1px; }
        .disclaimer p { font-size: 12px; color: #777; line-height: 1.7; }
        .disclaimer strong { color: #555; font-weight: 700; }
        @media (max-width: 480px) {
            .rg-top { grid-template-columns: 1fr; }
            .rg-team { border-right: none; border-bottom: 1px solid rgba(0,0,0,0.06); }
        }
    </style>
</head>
<body>
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>

    <!-- Doodle background layer -->
    <div class="doodle-layer">
      <svg viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg"
           style="opacity:0.18;" stroke="#c4607a" stroke-linecap="round" stroke-linejoin="round" fill="none">

        <!-- ✏️ ดินสอ 1 — บนซ้าย -->
        <g class="doodle-item" transform="translate(60,80) rotate(-30)">
          <rect x="0" y="0" width="10" height="60" rx="2" stroke-width="2"/>
          <polygon points="0,60 10,60 5,76" stroke-width="2"/>
          <line x1="0" y1="52" x2="10" y2="52" stroke-width="1.5"/>
          <rect x="0" y="0" width="10" height="12" rx="1" stroke-width="1.5"/>
          <line x1="5" y1="70" x2="5" y2="76" stroke-width="1.5"/>
        </g>

        <!-- ✏️ ดินสอ 2 — กลางบน -->
        <g class="doodle-item" transform="translate(480,40) rotate(20)">
          <rect x="0" y="0" width="10" height="60" rx="2" stroke-width="2"/>
          <polygon points="0,60 10,60 5,76" stroke-width="2"/>
          <line x1="0" y1="52" x2="10" y2="52" stroke-width="1.5"/>
          <rect x="0" y="0" width="10" height="12" rx="1" stroke-width="1.5"/>
        </g>

    function renderQuiz(c) {
        const idx = state.answers.length;
        const q = QUESTIONS[idx];
        const pct = Math.round((idx / QUESTIONS.length) * 100);

        app.innerHTML = `
        <div style="max-width:480px; margin:0 auto;">
          <div class="card slide-up">
            <div class="quiz-top">
              ${idx > 0 ? `<button class="btn-back" onclick="handleBack()">← ${c.back}</button>` : '<div style="height:36px"></div>'}
              <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
              
            </div>
            <div class="quiz-body">
              <div class="question-num">${c.qs} ${idx + 1}</div>
              <div class="question-text">${q.q[state.lang]}</div>
              <div class="quiz-btns">
                <button class="btn-yes" onclick="handleAnswer(true)">${c.yes}</button>
                <button class="btn-no" onclick="handleAnswer(false)">${c.no}</button>
              </div>
            </div>
          </div>
        </div>`;
    }

    function renderResult(c) {
        let scores = { R:0, I:0, A:0, S:0, E:0, C:0 };
        state.answers.forEach(a => { if (a.score) scores[a.type]++; });
        const counts = { R:2, I:4, A:3, S:3, E:4, C:4 };
        let pcts = {};
        Object.keys(scores).forEach(k => { pcts[k] = Math.round(scores[k] / counts[k] * 100); });

        let accScore = (pcts.I * 0.45) + (pcts.C * 0.45) + (pcts.S * 0.10);
        let saleScore = (pcts.E * 0.50) + (pcts.S * 0.30) + (pcts.A * 0.20);
        let winner = accScore >= saleScore ? 'ACC' : 'SAL';
        const dept = c.dept[winner];
        const color = winner === 'ACC' ? '#E8366F' : '#F2A138';
        const glowColor = winner === 'ACC' ? 'rgba(232,54,111,0.25)' : 'rgba(242,161,56,0.25)';

        const barColors = {
            R: '#b0b0b0', I: '#E8366F', A: '#9b6fd4', S: '#3ab5a0', E: '#F2A138', C: '#E8366F'

        if (state.answers.length >= QUESTIONS.length) { state.screen = 'result'; }
        render();
    }

    function restartQuiz() { state.screen = 'intro'; state.answers = []; render(); }

    function shareX(winner, name) {
        const text = state.lang === 'th'
            ? `ฉันเหมาะที่จะอยู่ ${name} — ลองดูว่าคุณเหมาะทีมไหน!`
            : `I belong in the ${name} — take the quiz to find out yours!`;
        window.open('https://twitter.com/intent/tweet?text=' + encodeURIComponent(text), '_blank');
    }

    function saveImage() {
        const card = document.getElementById('capture-card');
        if (!card || !window.html2canvas) { alert('Save feature requires html2canvas'); return; }
        html2canvas(card, { scale: 2, backgroundColor: '#ffffff' }).then(canvas => {
            const a = document.createElement('a');
            a.download = 'career-result.png';
            a.href = canvas.toDataURL('image/png');
            a.click();
        });
    }

    // ── Confetti ──
    function launchConfetti(primaryColor) {
        const canvas = document.getElementById('confetti-canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const colors = [primaryColor, '#fff', '#1a1625', '#f5c842', '#9b6fd4'];
        const particles = Array.from({ length: 120 }, () => ({
            x: Math.random() * canvas.width,
            y: -20 - Math.random() * 200,
            r: 4 + Math.random() * 6,
            d: 1 + Math.random() * 3,
            color: colors[Math.floor(Math.random() * colors.length)],
            angle: Math.random() * Math.PI * 2,
            spin: (Math.random() - 0.5) * 0.2,
            shape: Math.random() > 0.5 ? 'rect' : 'circle',
            w: 6 + Math.random() * 8,
            h: 8 + Math.random() * 12,
            drift: (Math.random() - 0.5) * 1.5,
        }));

        let frame = 0;
        const maxFrames = 200;

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                ctx.save();
                ctx.translate(p.x, p.y);
                ctx.rotate(p.angle);
                ctx.fillStyle = p.color;
                if (p.shape === 'rect') ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
                else { ctx.beginPath(); ctx.arc(0, 0, p.r, 0, Math.PI * 2); ctx.fill(); }
                ctx.restore();
                p.y += p.d;
                p.x += p.drift;
                p.angle += p.spin;
            });
            frame++;
            if (frame < maxFrames) requestAnimationFrame(draw);
            else { ctx.clearRect(0, 0, canvas.width, canvas.height); }
        }
        requestAnimationFrame(draw);
    }

    // Init
    document.getElementById('langToggle').checked = state.lang === 'en';
    render();
    </script>
